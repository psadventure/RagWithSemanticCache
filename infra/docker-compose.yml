# RagWithSemanticCache local stack: LiteLLM gateway (+ its Postgres) and Valkey.
#
# Adapted from LiteLLM's quickstart compose file
# (https://github.com/BerriAI/litellm/blob/main/docker/docker-compose.quickstart.yml,
#  docs: https://docs.litellm.ai/docs/proxy/docker_quick_start), with credit to BerriAI.
# Changes: own compose project name, ports bound to 127.0.0.1, the config/ folder and gcloud
# ADC mounted read-only, Vertex AI env, and a Valkey service for the semantic cache.
#
# Run from this folder (compose reads infra/.env):
#   cp .env.example .env      # then fill it in, see README.md
#   docker compose up -d
#
# Keep infra/.env once the database exists: changing LITELLM_SALT_KEY later makes the
# credentials stored in Postgres unreadable.

# Own project name, so this stack never collides with another LiteLLM compose project
# (containers, network and volumes are all prefixed with it).
name: ragwithsemanticcache

services:
  litellm:
    # For anything beyond local use, pin this to a specific release tag.
    image: docker.litellm.ai/berriai/litellm:latest
    command: ["--config", "/app/config/config.yaml"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in infra/.env - see README.md}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set it in infra/.env - see README.md}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/gcp/adc.json
      VERTEX_PROJECT: ${VERTEX_PROJECT:?set it in infra/.env}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-east1}
    volumes:
      # Mount the folder, not the file: single-file bind mounts go stale when an editor or
      # git replaces config.yaml, and the gateway then fails with a misleading 503.
      - ./config:/app/config:ro
      # gcloud Application Default Credentials, read-only. A single-file mount, so the
      # container sees only this credential. Recreate the container after re-running
      # `gcloud auth application-default login`.
      # Windows: set GCLOUD_ADC_PATH in infra/.env (forward slashes).
      - ${GCLOUD_ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/var/secrets/gcp/adc.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Valkey with the search module (vector index), used by the BetterDB semantic cache.
  # Needs bundle 9+: the search module in 8.1 has no TEXT fields, which BetterDB's index uses.
  valkey:
    image: valkey/valkey-bundle:9
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
